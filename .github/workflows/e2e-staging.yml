name: E2E Staging

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      
      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chrome
      
      - run: npm run build
      
      - run: npm run test:e2e:staging
        env:
          E2E_BASE_URL: https://staging.smart-exit-school.vercel.app
          SUPABASE_URL: https://apzxlahymqtjntjntbztong.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_STAGING }}
